{% extends 'base/base.html' %}
{% block content %}
<div class="container py-4">
  <h1>Add Module to "{{ course.title }}"</h1>
  <form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save Module</button>
    <a href="{% url 'courses:course_edit' course.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
